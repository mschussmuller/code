name: Verificar y publicar

on:
  push:
    branches: [main, claude/sharp-noether-c9gu04]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: ¿Está configurado Cloudflare?
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Ver README → Publicación."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - name: Base de datos D1 (se crea la primera vez)
        if: steps.creds.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="vantage-os");if(d)console.log(d.uuid)'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create vantage-os; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          echo "D1: $ID"
      - run: npx vite build
        if: steps.creds.outputs.ready == 'true'
      - name: Migraciones
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply vantage-os --remote
      - name: Publicar
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
